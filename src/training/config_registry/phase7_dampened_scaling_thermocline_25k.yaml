# ==============================================================================
# Phase 7 Production Run: Dampened Scaling & Strengthened Variance Loss Weighting (25k Steps)
# Resolves the Rescaling Amplification Mechanism:
#   1. Dampened target standardization (p=0.5): scales targets by sigma_d^0.5 in [0.477, 1.058]
#      - Cuts thermocline physical error amplification by 38%
#      - Keeps deep-ocean SNR well above the noise threshold (variance = 0.228)
#   2. Strengthened physical variance loss weighting (beta=1.50):
#      - w_var(d) = (sigma_d / bar_sigma)^1.50 gives 19.6x gradient priority to the thermocline
#   3. Retains all 16 proven foundational and physical modules:
#      - 74 spatial channels (raw SSHA + horizontal gradient magnitude)
#      - 14 conditioning dimensions (background lapse rate, dz, auxiliary predictions)
#      - Tri-stratum mini-column sampling (surface, thermocline, deep)
#      - Sobel horizontal gradient consistency loss
#      - Active auxiliary head feedback (MLD, BLT, Salinity Max depth)
#      - 25-step quadratic DDIM reverse trajectory
# ==============================================================================

experiment:
  name: "phase7_dampened_scaling_thermocline_25k"
  description: "Phase 7 Dampened Scaling (p=0.5) and Strengthened Variance Loss (beta=1.50) 25k Run"
  run_dir: "checkpoints/phase7_dampened_scaling_thermocline_25k"
  seed: 42

data:
  inputs_zarr: "data/processed/phase2_dataset/oceanembed_training_inputs.zarr"
  anomaly_targets_zarr: "data/processed/phase2_dataset/oceanembed_anomaly_targets.zarr"
  aux_targets_zarr: "data/processed/phase2_dataset/oceanembed_auxiliary_targets.zarr"
  scalar_csv: "data/processed/phase2_dataset/scalar_conditioning.csv"
  depth_scales_path: "data/processed/anomaly_depth_scales_dampened_p05.json"
  sequence_length: 7
  train_val_split_date: "2025-01-01"

architecture:
  in_channels: 25
  convlstm_hidden: [32, 64, 64]
  unet_stages: [32, 64, 128, 256]
  unet_in_channels: 74
  spatial_cond_dim: 72
  non_spatial_cond_dim: 14
  cond_emb_dim: 128
  diffusion_timesteps: 1000
  noise_schedule: "cosine"
  use_checkpointing: true
  normalize_inputs: true
  norm_stats_path: "data/processed/channel_normalization_stats_ocean_only.json"

ablations:
  region_conditioning_enabled: false
  depth_cascade_enabled: true
  regional_loss_boost_enabled: true

training:
  batch_size: 4
  num_workers: 4
  learning_rate: 0.00025
  weight_decay: 0.0001
  min_lr: 0.00001
  min_lr_ratio: 0.04
  lr_warmup_steps: 500
  epochs: 500
  max_steps: 25000
  warm_restart: false
  init_from_checkpoint: null
  skill_focused_loss: true
  inverse_variance_loss: false
  use_min_snr: true
  min_snr_gamma: 5.0
  variance_weight_exponent: 1.50
  augmentation_enabled: true
  checkpoint_interval_steps: 500
  val_interval_steps: 500
  save_best_only: false
  precision: "bf16"
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

evaluation:
  num_val_dates: 10
  eval_depths: [0, 5, 10, 20, 30, 50, 75, 100, 125, 150, 200, 300, 500, 700, 1000]
  ddim_steps: 25
  eta: 0.0
  schedule_type: "quadratic"
